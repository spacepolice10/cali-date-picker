<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minimal Cali Calendar</title>
    <script type="module" src="./calendar.js?v=year-list-2"></script>
    <style>
      cali-calendar::part(calendar) {
        display: grid;
        grid-template-columns: repeat(7, 2.5rem);
        gap: 0.25rem;
      }

      cali-calendar::part(weekday) {
        text-align: center;
        font-weight: bold;
      }

      cali-calendar::part(day) {
        aspect-ratio: 1;
        border: 1px solid transparent;
        border-radius: 50%;
      }

      cali-calendar::part(current-day) {
        border-color: #2563eb;
        color: #1d4ed8;
        font-weight: bold;
      }

      cali-calendar::part(selected-day) {
        border-color: #1d4ed8;
        background: #2563eb;
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Minimal Cali Calendar</h1>
      <p>Each calendar renders one complete month.</p>
    </header>

    <main>
      <section>
        <h2>Current month</h2>
        <form>
          <cali-calendar name="current-month"></cali-calendar>
          <button>Submit selected date</button>
        </form>
      </section>

      <section>
        <h2>Current month with Sunday-first grid alignment</h2>
        <p id="selected-date"></p>
        <cali-calendar
        id="calendar-1"
          with-weekdays
          with-offset
          with-switcher
        ></cali-calendar>
        <script nonce="1234567890">
          const calendar = document.getElementById("calendar-1");
          calendar.addEventListener("change", (event) => {
            console.log(event.detail.date);
            document.getElementById("selected-date").textContent = event.detail.date;
          });
        </script>
      </section>

      <section>
        <h2>Current month, Monday first</h2>
        <cali-calendar
          week-starts-on="mo"
          with-weekdays
          with-offset
          with-switcher
        ></cali-calendar>
      </section>

      <section>
        <h2>Preselected date</h2>
        <cali-calendar
          value="2026-09-13"
          week-starts-on="mo"
          with-weekdays
          with-offset
          with-switcher
        ></cali-calendar>
      </section>
    </main>
  </body>
</html>
