<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Live examples for Cali Date Picker web components."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230ea5e9'/%3E%3Cpath d='M18 24h28v24H18z' fill='white'/%3E%3Cpath d='M18 24h28v8H18z' fill='%23ec4899'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./demo.css" />
    <title>Cali Date Picker</title>
  </head>
  <body>
    <main>
      <label
        >Locale
        <select id="locale">
          <option value="en-US">English · US</option>
          <option value="en-GB">English · UK</option>
          <option value="vi-VN">Tiếng Việt</option>
          <option value="ja-JP">日本語</option>
        </select>
      </label>

      <form id="demo-form">
        <section id="date">
          <h2>Date</h2>
          <article>
            <h3>Calendar</h3>
            <cali-calendar name="date" months-number-to-draw="1"></cali-calendar>
          </article>
          <article>
            <h3>Date form</h3>
            <cali-dateform name="date-fields"></cali-dateform>
          </article>
        </section>

        <section id="time">
          <h2>Time</h2>
          <article>
            <h3>Clocks</h3>
            <cali-clocks name="time"></cali-clocks>
          </article>
          <article>
            <h3>Time form</h3>
            <cali-timeform name="time-fields"></cali-timeform>
          </article>
        </section>

        <section id="ranges">
          <h2>Ranges</h2>
          <article>
            <h3>Calendar range</h3>
            <div class="overflow">
              <cali-ranger-calendar
                name="from"
                end-name="to"
                months-number-to-draw="2"
              ></cali-ranger-calendar>
            </div>
          </article>
          <article>
            <h3>Time range</h3>
            <cali-ranger-clocks
              name="start-time"
              end-name="end-time"
            ></cali-ranger-clocks>
          </article>
        </section>

        <section id="form-data">
          <h2>Form data</h2>
          <button type="submit">Inspect</button>
          <pre
            aria-live="polite"
          ><code id="form-output">Select values, then inspect the form.</code></pre>
        </section>
      </form>
    </main>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
